<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sengonis · Plantation manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<base id="app-base" href="/"><script>
  // Resolve the deployment prefix before any relative asset is fetched.
  // On a deep link the view is the last path segment; everything before it
  // is the base (e.g. /V2/settings -> /V2/). Unknown views use the root.
  (() => {
    const views = ["home", "plants", "map", "inventory", "reports", "users", "settings"];
    const path = location.pathname;
    const parts = path.split("/").filter(Boolean);
    const isFile = parts[parts.length - 1] === "index.html";
    if (isFile) parts.pop();
    const index = parts.findLastIndex((part) => views.includes(part));
    // A trailing slash or a real index.html means the whole path is the base.
    // A known view is the last segment, so everything before it is the base.
    // Unknown views fall back to the domain root.
    const prefix = isFile || path.endsWith("/")
      ? parts
      : index < 0 ? [] : parts.slice(0, index);
    document.getElementById("app-base").href =
      "/" + prefix.join("/") + (prefix.length ? "/" : "");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

</head>
